name: build-and-push
# kokoro-tts-server — extends python:3.12-slim, torch CPU-only, and PRE-DOWNLOADS
# Kokoro weights in a build RUN (model warmup). Memory-heavy build — watch for
# OOM on the dind runner; if it fails, bump the runner memory limit.
# Registry unauthenticated.
on:
  push:
    branches:
      - main
jobs:
  build-and-push:
    runs-on: docker
    container:
      image: catthehacker/ubuntu:act-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Compute image tag
        id: tags
        run: |
          DATE=$(date +%Y-%m-%d)
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "date_sha=${DATE}-${SHA}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        run: |
          IMAGE=docker.graywind.org/kokoro-tts-server
          # Classic build+push (not buildx): this Dockerfile is linear,
          # single-arch, no cache/secret/multi-platform buildx features — so
          # classic is equivalent AND its push honors the dind daemon's
          # --max-concurrent-uploads=1, which buildx's own pusher may ignore.
          # Serializing uploads is what fixes the large-layer push failure
          # (parallel ~200MB layers dropped mid-stream → blob upload invalid).
          docker build \
            --tag "${IMAGE}:${{ steps.tags.outputs.date_sha }}" \
            --tag "${IMAGE}:latest" .
          docker push "${IMAGE}:${{ steps.tags.outputs.date_sha }}"
          docker push "${IMAGE}:latest"
