name: build-and-push
# kokoro-tts-server — extends python:3.12-slim, torch CPU-only, and PRE-DOWNLOADS
# Kokoro weights in a build RUN (model warmup). Memory-heavy build — watch for
# OOM on the dind runner; if it fails, bump the runner memory limit.
# Registry unauthenticated.
on:
  push:
    branches:
      - main
jobs:
  build-and-push:
    runs-on: docker
    container:
      image: catthehacker/ubuntu:act-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Compute image tag
        id: tags
        run: |
          DATE=$(date +%Y-%m-%d)
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "date_sha=${DATE}-${SHA}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        run: |
          IMAGE=docker.graywind.org/kokoro-tts-server
          # docker-container driver is required for local cache export
          # (the default `docker` driver only supports inline cache). The
          # builder container mounts /cache from the dind host (an NFS PVC —
          # see forgejo-runner dind-cache-pvc.yml), so the exported cache
          # survives runner restarts/reschedules and rebuilds stay warm.
          docker buildx create --name cache-builder --driver docker-container \
            --driver-opt network=host --use 2>/dev/null || docker buildx use cache-builder
          docker buildx build --push \
            --cache-from type=local,src=/cache \
            --cache-to   type=local,dest=/cache,mode=max \
            --tag "${IMAGE}:${{ steps.tags.outputs.date_sha }}" \
            --tag "${IMAGE}:latest" .
